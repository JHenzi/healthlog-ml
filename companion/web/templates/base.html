<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="rendered-at" content="{{ rendered_at() }}">
  <title>{% block title %}Companion{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v={{ static_v }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Companion">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1813" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/static/style.css?v={{ static_v }}">
  <link rel="stylesheet" href="/static/warm.css?v={{ static_v }}">
  <script src="/static/app.js?v={{ static_v }}" defer></script>
</head>
<body>
  <header class="bar">
    <span class="brand">Companion</span>
    {% block nav %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
