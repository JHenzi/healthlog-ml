{% set here = request.url.path %}
<nav class="nav" aria-label="Sections">
  <div class="tabs">
    <a href="/"{% if here == "/" %} aria-current="page"{% endif %}>Overview</a>
    <a href="/insights"{% if here.startswith("/insights") %} aria-current="page"{% endif %}>Discovery</a>
    <a href="/review"{% if here.startswith("/review") %} aria-current="page"{% endif %}>Capture</a>
    <a href="/metrics"{% if here.startswith("/metrics") %} aria-current="page"{% endif %}>My Metrics</a>
    <a href="/trackers"{% if here.startswith("/trackers") %} aria-current="page"{% endif %}>Trackers</a>
  </div>
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="link">Sign out</button>
  </form>
</nav>
