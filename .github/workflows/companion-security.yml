name: companion-security

# Findings, not gates (risks.md D7, E1): not a required check, so a new advisory can't block an unrelated PR. The
# weekly run is what catches an advisory published against code that hasn't changed; a failure emails the owner.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: "security: pip-audit"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements: [companion/requirements.txt, backend/requirements.txt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Installed, then audited locally, so transitive packages count too.
      - run: pip install -r "$REQUIREMENTS" pip-audit==2.10.1
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
      - run: pip-audit --local --skip-editable

  gitleaks:
    name: "security: gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm --network none -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact
