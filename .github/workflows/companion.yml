name: companion

on:
  push:
    paths: ["companion/**", "compose.companion.yml", ".github/workflows/companion*.yml", "!**/*.md"]
  # Every PR, not only companion ones: these are required checks for auto-merge into main, and a required
  # check that never starts would hold a PR forever.
  pull_request:

permissions:
  contents: read

jobs:
  # Markdown-only changes skip the tests and the image build. A skipped required check counts as passed, so a
  # docs PR still auto-merges; the path check always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qv '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check-paths:
    name: "companion: check paths"
    # R1 / risks.md A6: companion branches leave upstream-owned files alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream
        run: git remote add upstream https://github.com/anym001/healthlog.git && git fetch --quiet upstream dev
      - run: sh companion/scripts/check_paths.sh upstream/dev

  test:
    name: "companion: tests"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: healthlog
          POSTGRES_PASSWORD: healthlog
          POSTGRES_DB: healthlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U healthlog" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: companion
    env:
      COMPANION_TEST_ADMIN_URL: postgresql+psycopg://healthlog:healthlog@127.0.0.1:5432/companion_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: companion/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Fast suites: unit, integration, contract, security, privacy (stats runs nightly from M5).
      - run: python -m pytest -q

  image:
    name: "companion: image"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t healthlog-companion:ci companion
      - run: docker build -t healthlog-companion-collector:ci companion/collector
