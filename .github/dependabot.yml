version: 2
# This fork's own config: only what the Companion owns (R1). HealthLog's backend and upstream's workflows are
# left out on purpose: a PR touching them fails the required `companion: check paths`. Upstream's Dependabot
# keeps those fresh, and they arrive with the upstream sync. Alerts still cover the whole repo.
# On an upstream sync, keep this file.
updates:
  - package-ecosystem: "pip"
    directory: "/companion"
    target-branch: "main"
    schedule:
      interval: "monthly"
    groups:
      companion-python:
        patterns:
          - "*"
    # Security updates ignore the schedule and arrive as their own PRs.

  - package-ecosystem: "docker"
    directories:
      - "/companion"
      - "/companion/collector"
    target-branch: "main"
    schedule:
      interval: "monthly"
    groups:
      companion-docker:
        patterns:
          - "*"
