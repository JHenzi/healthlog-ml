# The Companion, layered on HealthLog's stack (upstream's docker-compose.yml stays untouched, R1):
#
#   docker compose -f docker-compose.yml -f compose.local.yml -f compose.companion.yml up -d --build
#
# One-time database setup first: see companion/README.md ("Install").
services:
  companion-web:
    build: ./companion
    image: healthlog-companion:dev
    container_name: healthlog-companion
    command: ["web"]
    depends_on:
      healthlog-db:
        condition: service_healthy
      # Started first so it creates the shared volume with its own ownership (it writes, we only read).
      companion-collector:
        condition: service_started
    ports:
      # Localhost only: reach it through Tailscale Serve or a reverse proxy on this host.
      - "${COMPANION_BIND:-127.0.0.1}:${COMPANION_PORT:-8020}:8000"
    environment: &companion-env
      # The `companion` role: owns schema companion, SELECT-only on HealthLog's tables.
      DATABASE_URL: postgresql+psycopg://companion:${COMPANION_DB_PASSWORD:?set COMPANION_DB_PASSWORD in .env}@healthlog-db:5432/healthlog
      # Required, no fallback: an inherited default zone shifts every day (risks.md L1).
      TZ: ${TZ:?set TZ in .env}
      DAY_BOUNDARY: ${DAY_BOUNDARY:-04:00}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      COOKIE_SECURE: ${COMPANION_COOKIE_SECURE:-true}
      # The almanac, computed here: day length from the latitude alone; holidays by country (default from TZ).
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-}
      HOLIDAYS_COUNTRY: ${HOLIDAYS_COUNTRY:-}
      # Reminders (opt-in): keys from `companion push keys`. Unset, nothing is sealed and the courier stays idle.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:companion@localhost}
    volumes:
      # The collector's weather file; read-only here, the Companion itself never fetches (R5).
      - companion-outside:/outside:ro
      # Sealed reminders for the courier, and its delivery reports. The Companion itself never sends (R5).
      - companion-push:/push
    restart: unless-stopped

  companion-jobs:
    image: healthlog-companion:dev
    container_name: healthlog-companion-jobs
    command: ["jobs"]
    depends_on:
      companion-web:
        condition: service_healthy
    environment: *companion-env
    volumes:
      - companion-outside:/outside:ro
      - companion-push:/push
    # No HTTP server in this process; the image's web health check doesn't apply.
    healthcheck:
      disable: true
    # The nightly analysis must never starve HealthLog or its database (risks.md F1).
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  # Weather (M3, opt-in): the one container that reaches the internet. It has no database credentials and no
  # health data, sits on its own network (it can't reach the database), and sends Open-Meteo only a location
  # rounded to ~10 km and a date range. Off until WEATHER_LATITUDE and WEATHER_LONGITUDE are set in .env.
  #   Backfill:  docker exec healthlog-companion-collector collector backfill --since 2026-07-15
  companion-collector:
    build: ./companion/collector
    image: healthlog-companion-collector:dev
    container_name: healthlog-companion-collector
    environment:
      TZ: ${TZ:?set TZ in .env}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-}
      WEATHER_SINCE: ${WEATHER_SINCE:-}
    volumes:
      - companion-outside:/data
    networks:
      - outside
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped

  # Reminders (opt-in): the courier posts reminders the Companion has already encrypted for your phone to its
  # push service (Apple's, for an iPhone). Same image and isolation as the collector: no database, no health
  # data, and it can't read the messages. Idle until PUSH_ENABLED=true.
  companion-courier:
    image: healthlog-companion-collector:dev
    container_name: healthlog-companion-courier
    command: ["deliver"]
    depends_on:
      companion-collector:
        condition: service_started
    environment:
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
    volumes:
      - companion-push:/push
    networks:
      - outside
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    restart: unless-stopped

volumes:
  companion-outside:
  companion-push:

networks:
  outside:
